name: publish-binaries
# Builds the installer workspace and publishes binaries as a release asset
# in the nethix-artifacts repo. Triggered after a green build-installer run.
on:
  workflow_run:
    workflows: [build-installer]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build workspace
        run: cargo build --release
        working-directory: installer

      - name: package binaries
        run: |
          mkdir -p dist
          cp installer/target/release/{summon,summon-exec,forge,scri} dist/
          cd dist && zip ../nethix-installer-binaries.zip summon summon-exec forge scri

      - name: publish to artifacts repo
        run: |
          gh release delete latest --repo LoreRealm/nethix-artifacts --yes 2>/dev/null || true
          gh release create latest --repo LoreRealm/nethix-artifacts \
            --title "Latest installer binaries" \
            --notes "Auto-published from main@${GITHUB_SHA}" \
            nethix-installer-binaries.zip
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_PAT }}
