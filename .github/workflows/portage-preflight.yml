name: portage-preflight
# Dependency-resolution preflight for the ISO package set.
#
# Boots a Gentoo stage3 container, seeds portage with the EXACT same
# config iso/build.sh uses (via iso/portage-seed.sh — shared, so they
# cannot drift), syncs the tree, then runs emerge --pretend on every
# package the ISO builds. Any keyword/license/USE/mask conflict shows
# up here in minutes instead of 10+ minutes into a local build.
#
# SELF-HEALING: on a failed resolve, re-runs emerge with autounmask
# and captures the REQUIREMENTS REPORT it prints to stderr/stdout —
# the exact lines portage itself recommends (USE changes, keyword
# changes, license changes, masks). Those, and ONLY those, get folded
# into iso/portage-seed.sh via a bot push. Never re-commits entries
# the seeder already provides; never rewrites on a no-op.
#
# ESCALATION: if self-heal can't fix it (no required changes found,
# push rejected, failure isn't a config problem), a GitHub issue is
# opened automatically with the portage error and log paste URL —
# nothing fails silently. Issues dedup by title: repeats comment on
# the existing issue instead of spamming new ones.
#
# AUTO-BUILD: a GREEN preflight queues the full ISO build
# (iso-build-report workflow) — resolve-verified commits go straight
# to a build without anyone clicking anything.
#
# RUNNER SELECTION: set the NETHIX_RUNNERS repo variable
# (Settings → Secrets and variables → Actions → Variables):
#   unset      → ubuntu-latest (default: GitHub-hosted, free for public repos)
#   hosted     → ubuntu-latest (explicit alias for the same)
#   label list → e.g. "self-hosted nethix" → your own runner
#
# Runs on push to main and daily (portage tree drifts — yesterday's
# clean resolve can break on tomorrow's snapshot).
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'   # daily 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  preflight:
    runs-on: ${{ vars.NETHIX_RUNNERS != '' && vars.NETHIX_RUNNERS || 'ubuntu-latest' }}
    timeout-minutes: 30
    container:
      image: gentoo/stage3:latest
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed portage config (same as build.sh)
        run: |
          chmod +x iso/portage-seed.sh
          bash iso/portage-seed.sh / 2

      - name: Sync portage tree
        run: emerge-webrsync || emerge --sync

      - name: Resolve live set (fastfetch + linux-firmware)
        run: emerge --pretend --columns app-misc/fastfetch sys-kernel/linux-firmware

      - name: Resolve kernel toolchain (installkernel + dracut)
        run: emerge --pretend --columns '>=sys-kernel/installkernel-70-r1[dracut]' 'sys-kernel/dracut[systemd]'

      - name: Resolve nethix-sources (Manifest will refresh at real build)
        run: emerge --pretend --columns sys-kernel/nethix-sources

      # On GREEN: queue the full ISO build (which publishes logs to
      # paste.rs + uploads the ISO artifact on success).
      - name: Queue ISO build (green preflight)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # avoid build storms: only auto-queue on push events and the
          # daily cron, not on manual dispatch (human chose preflight only)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "manual dispatch — skipping auto-build; trigger iso-build-report yourself if wanted"
            exit 0
          fi
          echo "preflight green — queueing iso-build-report build"
          gh workflow run iso-build-report.yml --repo "$REPO" \
            && echo "ISO build queued" \
            || echo "::warning::failed to queue iso-build-report (check workflow file name)"

      - name: Capture resolve failure details
        if: failure()
        run: |
          # run the pretend again, capturing output for the issue/report
          {
            emerge --pretend --columns app-misc/fastfetch sys-kernel/linux-firmware
            emerge --pretend --columns '>=sys-kernel/installkernel-70-r1[dracut]' 'sys-kernel/dracut[systemd]'
            emerge --pretend --columns sys-kernel/nethix-sources
          } > /tmp/resolve-fail.log 2>&1 || true
          # publish for the issue / later analysis (scrubbed, best-effort)
          sed -E 's/(chpasswd|password|PASS)=.*/\1=[scrubbed]/g' /tmp/resolve-fail.log > /tmp/resolve-fail.clean || true
          URL=$(curl -sf --max-time 60 --data-binary @/tmp/resolve-fail.clean https://paste.rs/) || URL="(paste.rs unreachable — log attached as step output above)"
          echo "FAIL_LOG_URL=$URL" >> "$GITHUB_ENV"
          tail -100 /tmp/resolve-fail.log || true   # also visible in the step log

      - name: Self-heal: autounmask requirements, committed to the seeder
        if: failure()
        run: |
          set -x
          # Re-run the failing resolves with autounmask. Portage PRINTS its
          # suggested config changes in the output (lines like:
          #   "The following USE changes are necessary to proceed:")
          # followed by the exact package entries). Capture that report —
          # it is the ONLY source of what to change. We do NOT use the
          # written /etc/portage/package.* files, because the seeder
          # legitimately populates those and mtime-diffing them re-commits
          # entries we already ship.
          {
            emerge --autounmask --autounmask-keep-going=y --pretend \
                app-misc/fastfetch sys-kernel/linux-firmware \
                '>=sys-kernel/installkernel-70-r1[dracut]' 'sys-kernel/dracut[systemd]' \
                sys-kernel/nethix-sources
          } > /tmp/autounmask.log 2>&1 || true

          # Fold ONLY portage's recommended lines into the seeder, bucketed
          # by which kind of change they are. Skip anything the seeder
          # already contains (no duplicate-block churn).
          python3 - <<'PY'
          import re

          seed_path = "iso/portage-seed.sh"
          with open(seed_path) as f:
              src = f.read()

          # Parse portage's requirement report. Sections look like:
          #   The following USE changes are necessary to proceed:
          #      # ... (optional comment)
          #      >=cat/pkg-1.2 foo -bar
          SECTION_RE = re.compile(
              r"^The following (\S+) changes? (?:are|is) (?:necessary|required)", re.M)
          SECTIONS = {
              "USE":            "# --- USE flags ---",
              "keyword":        "# --- keywords ---",
              "license":        "# --- licenses ---",
              "mask":           "# --- masks ---",
              "unmask":         "# --- masks ---",
              "uninstall":      None,
          }

          with open("/tmp/autounmask.log") as f:
              log = f.read()

          # split log into section chunks
          chunks = []
          starts = [(m.start(), m.group(1)) for m in SECTION_RE.finditer(log)]
          for i, (pos, kind) in enumerate(starts):
              end = starts[i + 1][0] if i + 1 < len(starts) else len(log)
               # each chunk: lines after the header that look like package atoms
              block = []
              for line in log[pos:end].splitlines()[1:]:
                  s = line.strip()
                  if not s:
                      continue
                  # package lines: start with >=, <=, =, ~, or category/name;
                  # comments start with '#' — keep them indented as-is
                  if s.startswith("#"):
                      continue
                  if re.match(r"^[<>=~]?[<>=]?[\w+][\w+.-]*/", s) or re.match(r"^[<>=~]", s):
                      block.append(s)
              chunks.append((kind, block))

          added_any = False
          for kind, entries in chunks:
              if not entries:
                  continue
              # normalize kind word ("USE changes" header says "USE changes are")
              marker = SECTIONS.get(kind.lower().replace("changes", "").strip(), None) or SECTIONS.get(kind, None)
              if marker is None or marker not in src:
                  print(f"no marker for section kind={kind!r} — skipping (entries would be lost)")
                  continue
              new_lines = "\n".join(entries)
              block_txt = "\n# appended by portage-preflight self-heal\n" + new_lines + "\n"
              # skip if all entries already present in seeder
              if all(e in src for e in entries):
                  print(f"{kind}: all entries already in seeder — skipping")
                  continue
              src = src.replace(marker, block_txt + marker)
              added_any = True
              print(f"{kind}: appending {len(entries)} entries")

          if added_any:
              with open(seed_path, "w") as f:
                  f.write(src)
              print("SEEDER_UPDATED=yes")
          else:
              print("SEEDER_UPDATED=no")
          PY

          if [[ "$(grep -c 'SEEDER_UPDATED=yes' /dev/stdin <<< '')" ]]; then true; fi
          UPDATED=$(python3 -c "
          src = open('iso/portage-seed.sh').read()
          print('yes' if 'appended by portage-preflight self-heal' in src else 'no')
          ")

          git config user.name  "nethix-preflight-bot"
          git config user.email "22435766+LoreRealm@users.noreply.github.com"
          git add iso/portage-seed.sh
          if [[ "$UPDATED" != "yes" ]] || git diff --cached --quiet; then
            echo "SELF_HEAL_STATUS=no-changes" >> "$GITHUB_ENV"
            echo "autounmask found no NEW config changes beyond what the seeder ships — failure was something else"
            exit 1
          fi
          if ! git push origin main; then
            echo "SELF_HEAL_STATUS=push-rejected" >> "$GITHUB_ENV"
            echo "bot push rejected — escalating to an issue"
            exit 1
          fi
          echo "SELF_HEAL_STATUS=fixed" >> "$GITHUB_ENV"
          echo "self-heal committed a fix; the triggered preflight run on the new commit will verify"

      # Runs after self-heal fails (or was skipped due to earlier failure).
      # Opens/reopens a deduplicated issue with full context.
      - name: Escalate: open GitHub issue with failure details
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAIL_LOG_URL: ${{ env.FAIL_LOG_URL }}
          SELF_HEAL: ${{ env.SELF_HEAL_STATUS }}
        run: |
          TITLE="preflight failed: portage cannot resolve the ISO package set"
          # dedupe: search for an existing OPEN issue with the same title
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "$TITLE" --json number --jq '.[0].number' || true)
          BODY=$(cat <<EOF
          ## Portage preflight failure

          **Run:** $RUN_URL
          **Trigger:** ${{ github.event_name }}
          **Self-heal status:** ${SELF_HEAL:-not-reached}
          **Resolve log:** $FAIL_LOG_URL

          ### Requirements
          - [ ] Read the resolve log / run output and identify the failing package(s)
          - [ ] If a required USE flag / keyword / license / mask: add to \`iso/portage-seed.sh\` (single source of truth) and let the preflight re-run verify
          - [ ] If ebuild-side: fix the ebuild in \`overlay/\`
          - [ ] Close this issue once the preflight on main is green
          EOF
          )
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Failure reoccurred (${SELF_HEAL:-not-reached}). $BODY"
            echo "commented on existing issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" --label ci
            echo "opened new issue"
          fi

      - name: Summary
        if: always()
        run: |
          if [[ "${SELF_HEAL_STATUS:-}" == "fixed" ]]; then
            echo "### Preflight self-healed"  >> "$GITHUB_STEP_SUMMARY"
            echo "Required config changes were auto-committed; the preflight run triggered by that commit verifies the fix." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Preflight complete" >> "$GITHUB_STEP_SUMMARY"
            echo "portage resolves the full ISO package set against today's tree" >> "$GITHUB_STEP_SUMMARY"
          fi
