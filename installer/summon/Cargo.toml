[package]
name = "summon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "summon"
path = "src/main.rs"

[[bin]]
name = "summon-exec"
path = "src/bin/exec-main.rs"

[lib]
name = "nethix_installer_lib"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
iced = "0.13"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
